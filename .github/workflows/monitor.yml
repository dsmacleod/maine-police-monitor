name: maine-police-monitor

# GitHub's cron can't be trusted for 5-minute polling (it ran a */5 schedule ~4 times a day), so one job
# runs `monitor.py loop`, polling every POLL_SECONDS for ~5.5 hours, then starts its own successor.
# The hourly schedule is only a backstop in case a handoff fails; while a loop is running, the
# concurrency group parks it as pending (at most one), and it starts when the current loop ends.
# Each poll also sends the digest when one is due (7 a.m. and 3 p.m. Eastern).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "loop, poll, digest, or check-pages"
        default: loop

concurrency:
  group: maine-police-monitor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the loop start its successor with `gh workflow run`

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Persist state.json (seen post IDs, digest queue) between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: police-state-${{ github.run_id }}
          restore-keys: police-state-

      - name: Run
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          POLL_SECONDS: "600"   # every 10 min: ~$4-5/mo on Apify (free plan caps at $5)
          PYTHONUNBUFFERED: "1"
        run: python3 monitor.py "${{ inputs.command || 'loop' }}" --minutes 330

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: police-state-${{ github.run_id }}

      - name: Start next loop
        if: always() && (inputs.command || 'loop') == 'loop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo "${{ github.repository }}" -f command=loop
