name: maine-police-monitor

# Polls every 5 minutes (the Actions minimum): sends urgent alerts, queues everything else,
# and sends the digest when one is due (7 a.m. and 3 p.m. Eastern; see DIGEST_HOURS_ET).
# The concurrency group keeps runs from overlapping on state.json.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "poll, digest, or check-pages"
        default: poll

concurrency:
  group: maine-police-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Persist state.json (seen post IDs, digest queue) between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: police-state-${{ github.run_id }}
          restore-keys: police-state-

      - name: Run
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 monitor.py "${{ inputs.command || 'poll' }}"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: police-state-${{ github.run_id }}
